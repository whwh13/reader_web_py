[project]
name = "reader-py"
version = "1.0.2"
description = "「阅读」小说服务的 Python 重写（本地单用户版，/reader3 API 兼容 legado.koplugin）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "parsel>=1.9",
    "lxml>=5.0",
    "jsonpath-ng>=1.6",
    "sqlmodel>=0.0.21",
    "pydantic-settings>=2.4",
    "quickjs>=1.19.4",
    "python-multipart>=0.0.9",
    "pycryptodome>=3.20",
    "charset-normalizer>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# 国内网络环境固定走 TUNA 镜像（工作区约定，见根 AGENTS.md）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
